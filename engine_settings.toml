[render]
# Render preset:
# - "Mobile"    = fastest, low-end laptops.
# - "Balanced"  = good quality/performance mix (recommended).
# - "Cinematic" = highest quality, heavy.
# - "Custom"    = uses the values below exactly.
preset = "Balanced"

# Shadows: main sunlight shadow maps.
# Turn off for large FPS gain.
shadows_enabled = true
# PCF smooths shadow edges.
pcf_enabled = true
# PCSS gives softer contact shadows (heavier).
pcss_enabled = false
# IBL = environment lighting/reflections.
ibl_enabled = true
# Probe lighting cache (more realistic ambient, moderate cost).
probes_enabled = false
# Legacy volumetric toggle (kept for compatibility).
volumetric_enabled = false
# Shadow map texture size. Higher = sharper shadows + more GPU cost.
shadow_resolution = 1024
# PCF sample count. Higher = softer shadows + more GPU cost.
pcf_samples = 4

# Distance + frustum culling skip objects camera can't see.
culling_enabled = true
culling_distance = 80.0
frustum_culling_enabled = true

# Bloom: glowy highlights around bright areas.
bloom_enabled = false
bloom_strength = 0.15
# SSAO: darkens tight corners to improve depth perception.
ssao_enabled = false
ssao_strength = 0.35
# Volumetric fog: light/fog depth in atmosphere (expensive).
volumetric_fog_enabled = false
fog_density = 0.03
# Voxel GI prototype: stylized bounced light estimate.
voxel_gi_enabled = false
voxel_gi_strength = 0.20
sun_azimuth_deg = 35.0
sun_elevation_deg = 42.0
sun_intensity = 1.0

[input]
gamepad_enabled = true
left_stick_deadzone = 0.2

[runtime]
# Multi-thread job system. Enable on stronger CPUs.
multithreading_enabled = false
# 0 = automatic thread count.
worker_threads = 0
# Profiler logs average timings to console.
profiler_enabled = true
profiler_log_interval_frames = 120
# Background mesh loading/streaming.
asset_streaming_enabled = true
# Wind animation for foliage/trees.
foliage_wind_enabled = true
# Update wind every N frames (2 = half-rate, cheaper CPU).
foliage_wind_update_divisor = 2
# Frame cap to reduce CPU usage when editor is open.
max_fps = 60
# Script watcher for hot-reload in Content/Scripts.
script_hot_reload_enabled = true
# External editor command template, e.g. 'code -r "{file}"' or 'notepad "{file}"'
preferred_script_editor = ""
# Watch Content/ for .obj/.png/.jpg changes and hot-reload assets.
asset_hot_reload_enabled = true
# Fast-object safety mode (substeps) to reduce bullet tunneling.
physics_ccd_enabled = false
# Upper bound for CCD substeps.
physics_max_substeps = 2
# Spatial hash broadphase reduces pair counts on larger scenes.
physics_broadphase_enabled = true
# Bucket size used by the broadphase hash.
physics_broadphase_cell_size = 2.5
# More iterations improve stability but cost more CPU.
physics_solver_iterations = 2
# Push intersecting bodies apart after contact solve.
physics_position_correction_enabled = true
# Sliding / wall friction response.
physics_friction_enabled = true
# Let idle bodies sleep to save CPU.
physics_sleeping_enabled = true
# Track collision started/stay/ended phases.
physics_collision_events_enabled = false
# Move foliage with smoothing instead of hard snapping.
physics_smooth_foliage_motion = false
# Enable spin / torque integration.
physics_angular_dynamics_enabled = true
# Advanced articulated constraints are heavier; keep off on this laptop.
physics_advanced_constraints_enabled = false
# Extra passes for joint / rope stability when advanced constraints are enabled.
physics_constraint_iterations = 1
# Use local anchor offsets when solving joints.
physics_local_anchor_constraints_enabled = false
# Enable full 3D OBB contact testing for rotated boxes.
physics_3d_obb_contacts_enabled = false
# Experimental articulated impulse solver path.
physics_articulated_impulse_solver_enabled = false
# Experimental manifold caching and warm starting.
physics_manifold_warm_start_enabled = false
# Experimental full 3-axis angular dynamics path.
physics_full_angular_3d_enabled = false
# GPU profile scaffold: auto, low, balanced, high, experimental.
gpu_scalability_tier = "auto"
# Old floating Hierarchy/Details panels instead of the docking workspace (deprecated).
legacy_editor_ui = false
